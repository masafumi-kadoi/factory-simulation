services:
  postgres:
    image: postgres:15-alpine
    container_name: factory-simulation-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: factory_simulation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./database/migrations/002_add_friendly_names.sql:/docker-entrypoint-initdb.d/002_add_friendly_names.sql
      - ./database/migrations/003_add_scenario_storage.sql:/docker-entrypoint-initdb.d/003_add_scenario_storage.sql
      - ./database/migrations/004_add_simdb_and_executor.sql:/docker-entrypoint-initdb.d/004_add_simdb_and_executor.sql
      - ./database/migrations/005_add_signal_log_fields.sql:/docker-entrypoint-initdb.d/005_add_signal_log_fields.sql
      - ./database/migrations/006_add_station_position.sql:/docker-entrypoint-initdb.d/006_add_station_position.sql
      - ./database/migrations/007_add_scenario_updated_at.sql:/docker-entrypoint-initdb.d/007_add_scenario_updated_at.sql
      - ./database/migrations/008_add_station_name.sql:/docker-entrypoint-initdb.d/008_add_station_name.sql
      - ./database/migrations/009_add_work_type_to_events.sql:/docker-entrypoint-initdb.d/009_add_work_type_to_events.sql
      - ./database/migrations/010_add_buffer_index.sql:/docker-entrypoint-initdb.d/010_add_buffer_index.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  simulation-core:
    build:
      context: ./simulation-core
      dockerfile: Dockerfile
    container_name: factory-simulation-core
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: factory_simulation
      PORT: 8080
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  sim-visualizer:
    build:
      context: ./sim-visualizer
      dockerfile: Dockerfile
    container_name: factory-sim-visualizer
    expose:
      - "80"
    depends_on:
      simulation-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  sim-editor:
    build:
      context: ./sim-editor
      dockerfile: Dockerfile
    container_name: factory-sim-editor
    expose:
      - "80"
    depends_on:
      simulation-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  sim-executor:
    build:
      context: ./sim-executor
      dockerfile: Dockerfile
    container_name: factory-sim-executor
    expose:
      - "80"
    depends_on:
      sim-executor-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  sim-executor-backend:
    build:
      context: ./sim-executor
      dockerfile: Dockerfile.backend
    container_name: factory-sim-executor-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: factory_simulation
      PORT: 8084
      SIMULATION_CORE_URL: http://simulation-core:8080
    expose:
      - "8084"
    depends_on:
      postgres:
        condition: service_healthy
      simulation-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  sim-portal:
    build:
      context: ./sim-portal
      dockerfile: Dockerfile
    container_name: factory-sim-portal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      simulation-core:
        condition: service_healthy
      sim-executor-backend:
        condition: service_healthy
      sim-visualizer:
        condition: service_healthy
      sim-editor:
        condition: service_healthy
      sim-executor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

volumes:
  postgres_data:
    driver: local

networks:
  factory-network:
    driver: bridge
