services:
  postgres:
    image: postgres:15-alpine
    container_name: factory-simulation-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: factory_simulation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./database/migrations/002_add_friendly_names.sql:/docker-entrypoint-initdb.d/002_add_friendly_names.sql
      - ./database/migrations/003_add_scenario_storage.sql:/docker-entrypoint-initdb.d/003_add_scenario_storage.sql
      - ./database/migrations/004_add_simdb_and_executor.sql:/docker-entrypoint-initdb.d/004_add_simdb_and_executor.sql
      - ./database/migrations/005_add_signal_log_fields.sql:/docker-entrypoint-initdb.d/005_add_signal_log_fields.sql
      - ./database/migrations/006_add_station_position.sql:/docker-entrypoint-initdb.d/006_add_station_position.sql
      - ./database/migrations/007_add_scenario_updated_at.sql:/docker-entrypoint-initdb.d/007_add_scenario_updated_at.sql
      - ./database/migrations/008_add_station_name.sql:/docker-entrypoint-initdb.d/008_add_station_name.sql
      - ./database/migrations/009_add_work_type_to_events.sql:/docker-entrypoint-initdb.d/009_add_work_type_to_events.sql
      - ./database/migrations/010_add_buffer_index.sql:/docker-entrypoint-initdb.d/010_add_buffer_index.sql
      - ./database/migrations/011_add_quality_status_to_work_events.sql:/docker-entrypoint-initdb.d/011_add_quality_status_to_work_events.sql
      - ./database/migrations/012_phase1_reconstruction.sql:/docker-entrypoint-initdb.d/012_phase1_reconstruction.sql
      - ./database/migrations/013_datasource_factory_link.sql:/docker-entrypoint-initdb.d/013_datasource_factory_link.sql
      - ./database/migrations/014_recreate_simulation_tables.sql:/docker-entrypoint-initdb.d/014_recreate_simulation_tables.sql
      - ./database/migrations/015_unified_factory_schema.sql:/docker-entrypoint-initdb.d/015_unified_factory_schema.sql
      - ./database/migrations/016_execution_simulation_time.sql:/docker-entrypoint-initdb.d/016_execution_simulation_time.sql
      - ./database/migrations/017_recreate_scenarios.sql:/docker-entrypoint-initdb.d/017_recreate_scenarios.sql
      - ./database/migrations/018_consolidate_equipment_groups.sql:/docker-entrypoint-initdb.d/018_consolidate_equipment_groups.sql
      - ./database/migrations/019_fix_orphaned_stations.sql:/docker-entrypoint-initdb.d/019_fix_orphaned_stations.sql
      - ./database/migrations/020_drop_scenario_tables.sql:/docker-entrypoint-initdb.d/020_drop_scenario_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  simulation-core:
    build:
      context: ./simulation-core
      dockerfile: Dockerfile
    container_name: factory-simulation-core
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: factory_simulation
      PORT: 8080
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  factory-poller:
    build:
      context: ./factory-poller
      dockerfile: Dockerfile
    container_name: factory-poller
    environment:
      PORT: 8091
      INTERNAL_DB_DSN: "host=postgres port=5432 dbname=factory_simulation user=postgres password=postgres sslmode=disable"
    expose:
      - "8091"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  realtime-gateway:
    build:
      context: ./realtime-gateway
      dockerfile: Dockerfile
    container_name: factory-realtime-gateway
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: factory_simulation
      PORT: 8090
      SIMULATION_CORE_URL: http://simulation-core:8080
      FACTORY_POLLER_URL: http://factory-poller:8091
    expose:
      - "8090"
    depends_on:
      postgres:
        condition: service_healthy
      simulation-core:
        condition: service_healthy
      factory-poller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  sim-visualizer:
    build:
      context: .
      dockerfile: sim-visualizer/Dockerfile
    container_name: factory-sim-visualizer
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  factory-visualizer:
    build:
      context: ./factory-visualizer
      dockerfile: Dockerfile
    container_name: factory-visualizer
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  sim-factory-manager:
    build:
      context: ./sim-factory-manager
      dockerfile: Dockerfile
    container_name: factory-sim-factory-manager
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  sim-executor:
    build:
      context: ./sim-executor
      dockerfile: Dockerfile
    container_name: factory-sim-executor
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  sim-executor-backend:
    build:
      context: ./sim-executor
      dockerfile: Dockerfile.backend
    container_name: factory-sim-executor-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: factory_simulation
      PORT: 8084
      SIMULATION_CORE_URL: http://simulation-core:8080
      REALTIME_GATEWAY_URL: http://realtime-gateway:8090
    expose:
      - "8084"
    depends_on:
      postgres:
        condition: service_healthy
      simulation-core:
        condition: service_healthy
      realtime-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  sim-portal:
    build:
      context: ./sim-portal
      dockerfile: Dockerfile
    container_name: factory-sim-portal
    expose:
      - "80"
    depends_on:
      sim-visualizer:
        condition: service_healthy
      factory-visualizer:
        condition: service_healthy
      sim-factory-manager:
        condition: service_healthy
      sim-executor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - factory-network

  nginx-proxy:
    build:
      context: ./nginx-proxy
      dockerfile: Dockerfile
    container_name: factory-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      sim-portal:
        condition: service_healthy
      sim-visualizer:
        condition: service_healthy
      factory-visualizer:
        condition: service_healthy
      sim-factory-manager:
        condition: service_healthy
      sim-executor:
        condition: service_healthy
      sim-executor-backend:
        condition: service_healthy
      realtime-gateway:
        condition: service_healthy
      simulation-core:
        condition: service_healthy
    networks:
      - factory-network

volumes:
  postgres_data:
    driver: local

networks:
  factory-network:
    driver: bridge
