<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Simulation Visualizer</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header id="menubar" class="menubar"></header>

        <main id="container-3d"></main>

        <div id="controls">
            <div class="timeline">
                <input type="range" id="timeline-slider" min="0" max="100" value="0" step="0.01">
                <span id="current-time">0.00s</span>
            </div>
            <div class="buttons">
                <button id="play-btn">▶ 再生</button>
                <button id="pause-btn" disabled>⏸ 停止</button>
                <button id="reset-btn">⏮ リセット</button>
                <select id="speed-select">
                    <option value="0.5">0.5x</option>
                    <option value="1" selected>1x</option>
                    <option value="2">2x</option>
                    <option value="5">5x</option>
                    <option value="10">10x</option>
                </select>
                <label class="checkbox-label">
                    <input type="checkbox" id="show-station-names" checked>
                    <span>ステーション名表示</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="show-work-ids" checked>
                    <span>ワークID表示</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="show-interlocks">
                    <span>インターロック表示</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="show-internal">
                    <span>内部表示</span>
                </label>
                <label class="checkbox-label" id="show-internal-names-label" style="display:none">
                    <input type="checkbox" id="show-internal-names" checked>
                    <span>内部名表示</span>
                </label>
                <label class="checkbox-label" id="internal-station-size-label" style="display:none">
                    <span>内部ステーションサイズ:</span>
                    <input type="range" id="internal-station-size" min="3" max="60" value="15" step="1" style="width:80px;vertical-align:middle">
                    <span id="internal-station-size-value">15</span>
                </label>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/visualizer.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
