<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario Editor - Factory Simulation</title>
    <link href="css/style.css" rel="stylesheet">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div class="editor-container">
        <!-- Menu Bar -->
        <header id="menubar" class="editor-header"></header>

        <!-- Hidden file input for import -->
        <input type="file" id="file-input" accept=".json" style="display: none;">

        <!-- Main Content: 3 Panes -->
        <div class="editor-main">
            <!-- Left: Tool Palette -->
            <aside class="tool-palette">
                <h3>ツール</h3>
                <div class="tool-section">
                    <h4>ステーション</h4>
                    <button class="tool-btn" data-tool="source" title="Source Station">
                        📦 Source
                    </button>
                    <button class="tool-btn" data-tool="processing" title="Processing Station">
                        ⚙️ Processing
                    </button>
                    <button class="tool-btn" data-tool="drain" title="Drain Station">
                        🗑️ Drain
                    </button>
                    <button class="tool-btn" data-tool="merge" title="Merge Station">
                        🔀 Merge
                    </button>
                    <button class="tool-btn" data-tool="split" title="Split Station">
                        🔃 Split
                    </button>
                    <button class="tool-btn" data-tool="moduler" title="Moduler Station">
                        📦📦 Moduler
                    </button>
                    <button class="tool-btn" data-tool="switch" title="Switch Station">
                        🔀🔃 Switch
                    </button>
                </div>
                <div class="tool-section">
                    <h4>編集</h4>
                    <button class="tool-btn active" data-tool="select" title="選択モード">
                        ✋ 選択
                    </button>
                    <button class="tool-btn" data-tool="connect" title="接続作成">
                        🔗 接続
                    </button>
                    <button class="tool-btn" data-tool="delete" title="削除">
                        🗑️ 削除
                    </button>
                </div>
                <div class="tool-section">
                    <h4>テンプレート</h4>
                    <button id="buffer-conveyor-btn" class="tool-btn" title="バッファコンベアを追加 (Moduler + N スロット)">
                        🚌 バッファ
                    </button>
                </div>
                <div class="tool-section">
                    <h4>オプション</h4>
                    <label style="display: flex; align-items: center; padding: 0.5rem; font-size: 0.875rem; cursor: pointer;">
                        <input type="checkbox" id="grid-snap-toggle" checked style="margin-right: 0.5rem;">
                        <span>グリッドスナップ</span>
                    </label>
                    <div class="align-toolbar" style="margin-top: 0.25rem;">
                        <button class="tool-btn align-btn" data-align="left" title="左揃え">
                            <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="3" fill="currentColor" opacity=".3"/><rect x="2" y="8" width="9" height="3" fill="currentColor"/><rect x="2" y="13" width="11" height="3" fill="currentColor" opacity=".3"/><line x1="2" y1="1" x2="2" y2="17" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="tool-btn align-btn" data-align="center-h" title="左右中央揃え">
                            <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="3" fill="currentColor" opacity=".3"/><rect x="4.5" y="8" width="9" height="3" fill="currentColor"/><rect x="3" y="13" width="12" height="3" fill="currentColor" opacity=".3"/><line x1="9" y1="1" x2="9" y2="17" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="tool-btn align-btn" data-align="right" title="右揃え">
                            <svg width="18" height="18" viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="3" fill="currentColor" opacity=".3"/><rect x="7" y="8" width="9" height="3" fill="currentColor"/><rect x="5" y="13" width="11" height="3" fill="currentColor" opacity=".3"/><line x1="16" y1="1" x2="16" y2="17" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="tool-btn align-btn" data-align="top" title="上揃え">
                            <svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="3" height="14" fill="currentColor" opacity=".3"/><rect x="8" y="2" width="3" height="9" fill="currentColor"/><rect x="13" y="2" width="3" height="11" fill="currentColor" opacity=".3"/><line x1="1" y1="2" x2="17" y2="2" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="tool-btn align-btn" data-align="middle-v" title="上下中央揃え">
                            <svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="3" height="14" fill="currentColor" opacity=".3"/><rect x="8" y="4.5" width="3" height="9" fill="currentColor"/><rect x="13" y="3" width="3" height="12" fill="currentColor" opacity=".3"/><line x1="1" y1="9" x2="17" y2="9" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="tool-btn align-btn" data-align="bottom" title="下揃え">
                            <svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="2" width="3" height="14" fill="currentColor" opacity=".3"/><rect x="8" y="7" width="3" height="9" fill="currentColor"/><rect x="13" y="5" width="3" height="11" fill="currentColor" opacity=".3"/><line x1="1" y1="16" x2="17" y2="16" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="tool-btn align-btn" data-align="distribute-h" title="左右等間隔">
                            <svg width="18" height="18" viewBox="0 0 18 18"><rect x="5" y="5" width="3" height="8" fill="currentColor"/><rect x="10" y="5" width="3" height="8" fill="currentColor" opacity=".5"/><line x1="2" y1="1" x2="2" y2="17" stroke="currentColor" stroke-width="2"/><line x1="16" y1="1" x2="16" y2="17" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="tool-btn align-btn" data-align="distribute-v" title="上下等間隔">
                            <svg width="18" height="18" viewBox="0 0 18 18"><rect x="5" y="5" width="8" height="3" fill="currentColor"/><rect x="5" y="10" width="8" height="3" fill="currentColor" opacity=".5"/><line x1="1" y1="2" x2="17" y2="2" stroke="currentColor" stroke-width="2"/><line x1="1" y1="16" x2="17" y2="16" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Center: Canvas -->
            <div class="canvas-container">
                <button id="toggle-3d-btn" title="2D / 3D 切替"
                        style="position:absolute;top:8px;right:8px;z-index:50;padding:4px 12px;border-radius:4px;border:1px solid #555;background:#222;color:#ccc;font-size:12px;cursor:pointer;">
                    3D
                </button>
                <div id="station-size-control" style="position:absolute;top:8px;right:60px;z-index:50;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,0.6);padding:4px 10px;border-radius:4px;border:1px solid #555;">
                    <span style="color:#ccc;font-size:12px;">サイズ:</span>
                    <input type="range" id="editor-station-size" min="0.2" max="5" value="1" step="0.1" style="width:80px;vertical-align:middle">
                    <span id="editor-station-size-value" style="color:#ccc;font-size:12px;min-width:24px;">1.0</span>
                </div>
                <div id="breadcrumb" class="breadcrumb" style="display: none;">
                    <span class="breadcrumb-item breadcrumb-root" data-depth="0">Root</span>
                </div>
                <div id="sub-scenario-toolbar" style="display:none;">
                    <div class="mode-buttons">
                        <button id="logic-mode-btn" class="mode-btn active">ロジック編集</button>
                        <button id="model-mode-btn" class="mode-btn">モデル編集</button>
                    </div>
                    <div id="model-editing-controls" style="display:none;">
                        <button id="block-size-btn">ブロックサイズ切替</button>
                        <button id="block-height-btn">ブロック高さ切替</button>
                        <button id="origin-set-btn">基準点設定</button>
                        <button id="model-confirm-btn" class="btn-primary">モデル決定</button>
                        <button id="model-import-btn">インポート</button>
                        <button id="model-reset-btn" style="display:none;">リセット</button>
                        <button id="model-export-btn" disabled>エクスポート</button>
                    </div>
                </div>
                <canvas id="model-editor-canvas" style="display:none;"></canvas>
                <canvas id="editor-3d-canvas"></canvas>
                <canvas id="model-footprint-canvas"
                        style="display:none; position:absolute; top:0; left:0; pointer-events:none;"></canvas>
                <input type="file" id="model-file-input" accept=".gltf,.glb" style="display:none;">
                <svg id="canvas" width="100%" height="100%">
                    <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7"
                                refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#999" />
                        </marker>
                        <marker id="arrowhead-selected" markerWidth="10" markerHeight="7"
                                refX="9" refY="3.5" orient="auto">
                            <polygon points="0 0, 10 3.5, 0 7" fill="#4a9eff" />
                        </marker>
                    </defs>
                    <!-- Grid (behind everything) -->
                    <g id="grid-layer"></g>
                    <!-- Ghost layer for parent scenario in SubScenario editing -->
                    <g id="ghost-layer" opacity="0.15" style="pointer-events:none;"></g>
                    <!-- Connections drawn first (behind stations) -->
                    <g id="connections-layer"></g>
                    <!-- Stations drawn on top -->
                    <g id="stations-layer"></g>
                </svg>
                <div id="canvas-info" class="canvas-info">
                    クリックでステーション配置 | ドラッグで移動
                </div>
            </div>

            <!-- Right: Properties Panel -->
            <aside class="properties-panel">
                <h3 style="display: flex; align-items: center; justify-content: space-between;">
                    プロパティ
                    <label id="auto-save-toggle" style="display: flex; align-items: center; font-size: 0.75rem; font-weight: normal; cursor: pointer; gap: 0.25rem;">
                        <input type="checkbox" id="auto-save-checkbox">
                        <span>自動保存</span>
                    </label>
                </h3>
                <div id="properties-content">
                    <!-- Properties displayed here -->
                </div>
            </aside>
        </div>
    </div>

    <script type="module" src="js/editor.js"></script>
</body>
</html>
