<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario List - Factory Simulation Editor</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="list-container">
        <header class="list-header">
            <h1>Factory Simulation - Scenario Editor</h1>
            <div class="list-header-actions">
                <a href="http://localhost:8083" target="_blank" class="btn-outline header-link">sim-executor</a>
                <button id="new-scenario-btn" class="btn-primary">➕ 新規作成</button>
            </div>
        </header>

        <main class="list-main">
            <div class="sort-bar">
                <span class="sort-label">並び替え:</span>
                <button class="sort-btn active" data-sort="name">名前順</button>
                <button class="sort-btn" data-sort="createdAt">作成日順</button>
                <button class="sort-btn" data-sort="updatedAt">保存日時順</button>
            </div>
            <div id="scenario-list" class="scenario-list">
                <!-- シナリオがここに表示される -->
            </div>
            <div id="empty-state" class="empty-state">
                <p>📋 シナリオがありません</p>
                <p class="empty-state-hint">「新規作成」ボタンでシナリオを作成してください</p>
            </div>
        </main>
    </div>

    <script type="module" src="js/list.js"></script>
</body>
</html>
