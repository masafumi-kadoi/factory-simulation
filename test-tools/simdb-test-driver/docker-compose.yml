services:
  simdb-postgres:
    profiles: [standalone]
    build: ./postgres
    environment:
      POSTGRES_DB: ${SIMDB_DB_NAME}
      POSTGRES_USER: ${SIMDB_DB_USER}
      POSTGRES_PASSWORD: ${SIMDB_DB_PASSWORD}
    ports:
      - "${SIMDB_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIMDB_DB_USER} -d ${SIMDB_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  simdb-driver:
    build: ./driver
    environment:
      DB_HOST: ${SIMDB_DB_HOST:-simdb-postgres}
      DB_PORT: ${SIMDB_DB_PORT:-5432}
      DB_NAME: ${SIMDB_DB_NAME}
      DB_USER: ${SIMDB_DB_USER}
      DB_PASSWORD: ${SIMDB_DB_PASSWORD}
      DRIVER_PORT: ${SIMDB_DRIVER_PORT}
      INITIAL_SPEED: ${SIMDB_SPEED}
      TARGET_MODE: ${SIMDB_TARGET_MODE:-standalone}
      GATEWAY_URL: ${SIMDB_GATEWAY_URL:-}
      DATA_SOURCE_ID: ${SIMDB_DATA_SOURCE_ID:-}
      NORMALIZE_TIMESTAMPS: ${SIMDB_NORMALIZE_TIMESTAMPS:-}
    ports:
      - "${SIMDB_DRIVER_PORT}:${SIMDB_DRIVER_PORT}"
    volumes:
      - ./data:/data
