# digital-twin 内部リバースプロキシ（HTTP 専用）
#
# densei-system 統合時の入口。system-proxy が `/digital-twin` プレフィックスを
# rewrite で除去した後の素のリクエスト（/portal, /api, /ws ...）を受け取り、
# 各サービスへ振り分ける。TLS は densei-system 上位の AWS 層で終端する前提のため、
# ここでは HTTPS 終端・証明書を持たない（ローカル単体起動は従来の nginx-proxy:443 を使用）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 50m;

    # ヘルスチェック（system-proxy / コンテナ監視用）
    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    location = / {
        return 301 /portal/;
    }

    location /portal/ {
        proxy_pass http://sim-portal:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /factory-visualizer/ {
        proxy_pass http://factory-visualizer:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /factory/ {
        proxy_pass http://sim-factory-manager:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/simulations {
        proxy_pass http://simulation-core:8080/api/simulations;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/simulations/ {
        proxy_pass http://simulation-core:8080/api/simulations/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://realtime-gateway:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    location /ws {
        proxy_pass http://realtime-gateway:8090/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
