<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Editor</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { box-sizing: border-box; }
        body { background: var(--bg-primary); overflow: hidden; margin: 0; }
        #local-app { display: flex; flex-direction: column; height: 100vh; }

        /* ---- Toolbar ---- */
        #local-toolbar {
            height: 36px;
            background: var(--bg-panel-hdr);
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; gap: 8px; padding: 0 12px;
            flex-shrink: 0;
        }
        #local-title { font-size: 13px; font-weight: 600; flex: 1; }

        /* ---- Tabs ---- */
        .tab-bar {
            display: flex;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .tab {
            padding: 8px 16px; font-size: 12px; cursor: pointer;
            color: var(--text-secondary); border-bottom: 2px solid transparent;
            user-select: none;
        }
        .tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }

        .tab-content { display: none; flex: 1; min-height: 0; }
        .tab-content.active { display: flex; flex-direction: column; }

        /* ---- Info tab ---- */
        #tab-info { padding: 16px; overflow-y: auto; }
        .field-group { margin-bottom: 14px; }
        .field-group label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }
        .field-group input, .field-group textarea, .field-group select {
            width: 100%; background: var(--bg-input); color: var(--text-primary);
            border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            padding: 6px 8px; font-size: 12px; font-family: inherit;
        }
        .field-group textarea { min-height: 80px; resize: vertical; }

        /* ---- Model3D tab ---- */
        #tab-model3d { flex-direction: row; }
        .model-left {
            flex: 1; display: flex; flex-direction: column; min-width: 0;
            border-right: 1px solid var(--border-color);
        }
        .model-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .model-toolbar {
            padding: 6px 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
            background: var(--bg-panel); border-bottom: 1px solid var(--border-color); flex-shrink: 0;
        }
        .model-toolbar .tool-btn {
            font-size: 11px; padding: 3px 9px; background: var(--bg-surface);
            color: var(--text-primary); border: 1px solid var(--border-color);
            border-radius: 3px; cursor: pointer;
        }
        .model-toolbar .tool-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .model-toolbar .tool-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
        #model-status { font-size: 11px; color: var(--text-muted); margin-left: 4px; }

        #model-grid-canvas {
            flex: 1; width: 100%; min-height: 0;
            display: block; cursor: crosshair;
        }
        #model-3d-canvas { flex: 1; width: 100%; min-height: 0; display: block; }

        .model-3d-header {
            padding: 6px 10px; font-size: 11px; color: var(--text-muted);
            background: var(--bg-panel); border-bottom: 1px solid var(--border-color); flex-shrink: 0;
        }

        /* ---- Logic tab ---- */
        #tab-logic { flex-direction: row; }

        .logic-palette {
            width: 120px; flex-shrink: 0; display: flex; flex-direction: column; gap: 3px;
            padding: 8px 6px; background: var(--bg-panel); border-right: 1px solid var(--border-color);
            overflow-y: auto;
        }
        .palette-section {
            font-size: 10px; color: var(--text-muted); margin: 6px 0 2px; text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .logic-palette .tool-btn {
            font-size: 11px; padding: 5px 4px; text-align: center;
            background: var(--bg-surface); color: var(--text-primary);
            border: 1px solid var(--border-color); border-radius: 3px; cursor: pointer;
        }
        .logic-palette .tool-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .logic-palette .tool-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

        /* 未配置ステーションリスト */
        #unplaced-station-list { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; overflow-y: auto; }
        .unplaced-item {
            font-size: 10px; padding: 4px 5px; line-height: 1.3;
            background: var(--bg-surface); color: var(--text-secondary);
            border: 1px solid var(--border-color); border-radius: 3px; cursor: grab;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: none;
        }
        .unplaced-item:hover { border-color: var(--accent-blue); color: var(--text-primary); }
        .unplaced-item:active { cursor: grabbing; opacity: 0.6; }
        .unplaced-empty { font-size: 10px; color: var(--text-muted); padding: 4px 2px; }
        .unplaced-add-row { display: flex; gap: 3px; margin-top: 2px; }
        .unplaced-add-row select {
            flex: 1; font-size: 10px; padding: 3px 2px;
            background: var(--bg-input); color: var(--text-primary);
            border: 1px solid var(--border-color); border-radius: 3px; min-width: 0;
        }
        #btn-add-station {
            font-size: 11px; padding: 3px 5px; flex-shrink: 0;
            background: var(--bg-surface); color: var(--accent-blue);
            border: 1px solid var(--accent-blue); border-radius: 3px; cursor: pointer;
        }
        #btn-add-station:hover { background: var(--accent-blue); color: #fff; }

        .logic-canvas-area {
            flex: 1; position: relative; min-width: 0; overflow: hidden;
            background: var(--bg-surface);
        }
        #logic-projection-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 0;
        }
        #logic-svg {
            position: absolute; inset: 0; width: 100%; height: 100%; display: block;
            z-index: 1; background: transparent;
        }
        #logic-info-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(15,22,41,0.85); border-top: 1px solid var(--border-color);
            padding: 4px 10px; font-size: 11px; color: var(--text-secondary);
        }

        .logic-props {
            width: 200px; flex-shrink: 0; display: flex; flex-direction: column;
            background: var(--bg-panel); border-left: 1px solid var(--border-color);
            padding: 10px; overflow-y: auto;
        }
        .props-title { font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; }
        .props-empty { font-size: 11px; color: var(--text-muted); }
        .props-field { margin-bottom: 10px; }
        .props-field label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
        .props-field input, .props-field select {
            width: 100%; background: var(--bg-input); color: var(--text-primary);
            border: 1px solid var(--border-color); border-radius: 3px;
            padding: 4px 6px; font-size: 11px; font-family: inherit;
        }
        .props-delete-btn {
            margin-top: 8px; font-size: 11px; padding: 4px 8px;
            background: var(--status-error, #dc3545); color: #fff;
            border: none; border-radius: 3px; cursor: pointer; width: 100%;
        }
        .props-section-header {
            font-size: 10px; font-weight: 600; color: var(--text-secondary);
            border-top: 1px solid var(--border-color); margin-top: 4px; padding-top: 8px;
        }
        .props-hint { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
        .props-checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--text-muted); cursor: pointer; }
        .props-checkbox-label input[type="checkbox"] { width: auto; margin: 0; }
        .props-port-row {
            display: flex; align-items: center; gap: 4px;
            margin-bottom: 4px; font-size: 10px;
        }
        .props-port-label { color: var(--text-muted); min-width: 40px; }
        .props-port-capacity { width: 44px !important; text-align: right; }
        .props-port-unit { color: var(--text-muted); white-space: nowrap; }

        /* ---- Bottom bar ---- */
        .bottom-bar {
            background: var(--bg-panel); border-top: 1px solid var(--border-color);
            padding: 10px 16px; display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0;
        }
        .btn-secondary {
            background: var(--bg-surface); color: var(--text-primary);
            border: 1px solid var(--border-color); border-radius: var(--radius-sm);
            padding: 6px 14px; font-size: 12px; cursor: pointer;
        }

        /* ---- Interlock rule editor (props panel) ---- */
        #props-interlock-section { margin-top: 4px; }
        .il-section-header { display: flex; justify-content: space-between; align-items: center; }
        .il-custom-badge {
            font-size: 9px; background: var(--status-warning, #e67e22); color: #fff;
            border-radius: 3px; padding: 1px 4px; margin-left: 4px; vertical-align: middle;
        }
        .il-summary-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 4px;
        }
        .il-summary-text { font-size: 10px; color: var(--text-muted); }
        .il-edit-btn {
            font-size: 10px; padding: 3px 10px; cursor: pointer;
            background: var(--accent, #4a9eff); color: #fff;
            border: none; border-radius: 3px; white-space: nowrap;
        }

        /* ---- Interlock modal overlay ---- */
        .il-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
        }
        .il-modal {
            background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 8px; width: min(940px, 95vw); max-height: 88vh;
            display: flex; flex-direction: column;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
        }
        .il-modal-header {
            padding: 12px 16px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        .il-modal-title { font-size: 13px; font-weight: 600; }
        .il-modal-close {
            background: none; border: none; color: var(--text-muted);
            font-size: 18px; cursor: pointer; line-height: 1; padding: 0 4px;
        }
        .il-tab-bar {
            display: flex; border-bottom: 1px solid var(--border-color);
            padding: 0 16px; flex-shrink: 0; background: var(--bg-surface);
        }
        .il-modal-tab {
            padding: 8px 14px; font-size: 11px; cursor: pointer;
            background: none; border: none; border-bottom: 2px solid transparent;
            color: var(--text-muted); margin-bottom: -1px; white-space: nowrap;
        }
        .il-modal-tab.active {
            color: var(--text-primary); border-bottom-color: var(--accent, #4a9eff); font-weight: 600;
        }
        .il-tab-on  { color: #4caf50; font-weight: 700; }
        .il-tab-off { color: #e57373; font-weight: 700; }
        .il-modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

        /* Flow view */
        .il-flow-section {
            padding: 10px 16px; border-bottom: 1px solid var(--border-color);
            background: var(--bg-surface); flex-shrink: 0;
        }
        .il-section-label {
            font-size: 9px; font-weight: 700; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px;
        }
        .il-flow-view { display: flex; flex-direction: column; gap: 5px; }
        .il-flow-row {
            display: flex; align-items: center; gap: 8px; font-size: 11px;
            padding: 3px 0; border-bottom: 1px solid var(--border-color);
        }
        .il-flow-row:last-child { border-bottom: none; }
        .il-flow-or-sep {
            text-align: center; font-size: 10px; font-weight: 700;
            color: var(--text-muted); letter-spacing: 1px;
            padding: 2px 0; opacity: 0.7;
        }
        .il-flow-rid {
            font-family: monospace; font-size: 10px; font-weight: 600;
            color: var(--text-muted); min-width: 22px; flex-shrink: 0;
        }
        .il-flow-conditions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; flex: 1; }
        .il-flow-conds-multi { display: flex; flex-direction: column; gap: 2px; }
        .il-flow-cond-chip {
            background: var(--bg-input); border: 1px solid var(--border-color);
            border-radius: 3px; padding: 1px 5px; font-size: 10px; font-family: monospace; white-space: nowrap;
        }
        .il-cond-empty { color: var(--text-muted); border-style: dashed; }
        .il-flow-and { font-size: 9px; font-weight: 700; color: var(--text-muted); padding: 0 3px; }
        .il-flow-arrow { font-size: 13px; color: var(--text-muted); flex-shrink: 0; }
        .il-flow-target-chip {
            padding: 2px 8px; border-radius: 4px; font-size: 11px; font-family: monospace;
            font-weight: 700; white-space: nowrap; flex-shrink: 0;
        }
        .il-chip-on  { background: rgba(40,167,69,0.15); border: 1px solid #28a745; color: #4caf50; }
        .il-chip-off { background: rgba(220,53,69,0.15); border: 1px solid #dc3545; color: #e57373; }
        .il-flow-desc { font-size: 10px; color: var(--text-muted); font-style: italic; flex-shrink: 0; }
        .il-flow-empty { font-size: 11px; color: var(--text-muted); padding: 6px 0; }

        /* Detail editor */
        .il-detail-section { padding: 10px 16px; flex: 1; }
        .il-detail-editor { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
        .il-detail-rule {
            background: var(--bg-input); border: 1px solid var(--border-color);
            border-radius: 4px; padding: 8px 10px;
        }
        .il-detail-rule-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
        .il-detail-rule-header input[type="text"] { flex: 1; font-size: 11px; min-width: 0; }
        .il-rule-id {
            font-family: monospace; font-size: 10px; font-weight: 700;
            color: var(--text-muted); min-width: 22px; flex-shrink: 0;
        }
        .il-rule-desc { flex: 1; min-width: 0; }
        .il-rule-del {
            font-size: 9px; padding: 2px 6px; cursor: pointer; flex-shrink: 0;
            background: var(--status-error, #dc3545); color: #fff; border: none; border-radius: 3px;
        }
        .il-detail-conditions { padding-left: 28px; display: flex; flex-direction: column; gap: 4px; }
        .il-detail-cond-row { display: flex; align-items: center; gap: 4px; }
        .il-detail-cond-row select { flex: 1; min-width: 0; }
        .il-cond-del {
            font-size: 9px; padding: 2px 5px; cursor: pointer; flex-shrink: 0;
            background: var(--bg-surface); color: var(--status-error, #dc3545);
            border: 1px solid var(--status-error, #dc3545); border-radius: 3px;
        }
        .il-cond-add {
            font-size: 9px; padding: 2px 7px; cursor: pointer; align-self: flex-start; margin-top: 2px;
            background: var(--bg-surface); color: var(--text-secondary);
            border: 1px solid var(--border-color); border-radius: 3px;
        }
        .il-add-btn {
            font-size: 11px; padding: 5px 10px; cursor: pointer; width: 100%;
            background: var(--bg-surface); color: var(--text-secondary);
            border: 1px solid var(--border-color); border-radius: 3px;
        }
        .il-lbl { font-size: 10px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
        .il-val-label {
            display: flex; align-items: center; gap: 3px;
            font-size: 10px; color: var(--text-muted); cursor: pointer; flex-shrink: 0;
        }
        .il-val-label input[type="checkbox"] { width: auto; margin: 0; }
        .il-reset-btn {
            font-size: 10px; padding: 4px 10px; cursor: pointer;
            background: var(--bg-surface); color: var(--text-muted);
            border: 1px solid var(--border-color); border-radius: 3px;
        }
        .il-modal-footer {
            padding: 10px 16px; border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }

        /* ---- Modals ---- */
        .lw-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .lw-modal {
            background: var(--bg-panel); border: 1px solid var(--border-color);
            border-radius: 6px; min-width: 260px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .lw-modal-header {
            padding: 12px 14px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
        }
        .lw-modal-title { font-size: 13px; font-weight: 600; }
        .lw-modal-close { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; }
        .lw-modal-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .lw-modal-body label { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
        .lw-modal-body input[type="number"] {
            width: 80px; padding: 4px 6px; background: var(--bg-input);
            color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 3px; font-size: 12px;
        }
        .lw-modal-footer {
            padding: 10px 14px; border-top: 1px solid var(--border-color);
            display: flex; justify-content: flex-end; gap: 8px;
        }
    </style>
</head>
<body>
<div id="local-app">
    <div id="local-toolbar">
        <span id="local-title">Machine Editor</span>
        <span id="local-factory-info" style="color:var(--text-muted);font-size:11px;"></span>
    </div>
    <div class="tab-bar">
        <div class="tab active" data-tab="info">モデル情報</div>
        <div class="tab" data-tab="model3d">3Dモデル編集</div>
        <div class="tab" data-tab="logic">ロジック編集</div>
    </div>

    <!-- Tab: Info -->
    <div class="tab-content active" id="tab-info">
        <div class="field-group">
            <label>設備名 (name)</label>
            <input type="text" id="info-name" placeholder="設備名を入力">
        </div>
        <div class="field-group">
            <label>メタデータ (JSON)</label>
            <textarea id="info-metadata" placeholder='{"description": ""}'></textarea>
        </div>
        <div class="field-group">
            <label>Station ID</label>
            <input type="text" id="info-sid" readonly style="opacity:0.6">
        </div>
    </div>

    <!-- Tab: 3D Model -->
    <div class="tab-content" id="tab-model3d">
        <div class="model-left">
            <div class="model-toolbar">
                <button class="tool-btn" id="btn-origin-mode">原点設定</button>
                <button class="tool-btn" id="btn-clear-cells">クリア</button>
                <button class="tool-btn" id="btn-grid-size">格子設定</button>
                <button class="tool-btn" id="btn-height-set">高さ設定</button>
                <button class="tool-btn" id="btn-import-glb" style="margin-left:8px;">GLBインポート</button>
                <input type="file" id="model-glb-input" accept=".glb,.gltf" style="display:none">
                <button class="tool-btn" id="btn-delete-model" style="margin-left:4px;color:var(--status-error,#dc3545);border-color:var(--status-error,#dc3545);">モデル削除</button>
                <span id="model-status"></span>
            </div>
            <canvas id="model-grid-canvas"></canvas>
        </div>
        <div class="model-right">
            <div class="model-3d-header">3D プレビュー <button class="tool-btn" id="btn-refresh-3d-preview" style="float:right;font-size:10px;padding:2px 8px;line-height:1.4;">更新</button></div>
            <canvas id="model-3d-canvas"></canvas>
        </div>
    </div>

    <!-- Tab: Logic -->
    <div class="tab-content" id="tab-logic">
        <div class="logic-palette">
            <div class="palette-section" style="display:flex;justify-content:space-between;align-items:center;">ツール <button class="tool-btn" id="btn-refresh-logic" style="font-size:10px;padding:1px 6px;line-height:1.4;">更新</button></div>
            <button class="tool-btn active" data-tool="select">選択</button>
            <button class="tool-btn" data-tool="connect">接続</button>
            <button class="tool-btn" data-tool="delete">削除</button>
            <div class="palette-section">サイズ</div>
            <div style="display:flex;flex-direction:column;gap:3px;padding:2px 0;">
                <input type="range" id="station-radius-slider" min="0.1" max="10" value="0.25" step="0.05"
                       style="width:100%;accent-color:var(--accent-blue);">
                <div style="display:flex;align-items:center;gap:3px;">
                    <input type="number" id="station-radius-input" value="0.25" min="0.1" max="10" step="0.05"
                           style="flex:1;width:0;font-size:11px;padding:2px 4px;background:var(--bg-input,#1a2234);border:1px solid var(--border-color,#2a3a5c);border-radius:3px;color:var(--text-primary,#c8d4e8);">
                    <span style="font-size:10px;color:var(--text-muted);white-space:nowrap;">m</span>
                </div>
            </div>
            <div class="palette-section">原点</div>
            <button class="tool-btn" id="btn-logic-origin-mode">原点設定</button>
            <div id="logic-origin-pos" style="font-size:10px;color:var(--text-muted);padding:2px 4px;white-space:pre-line;line-height:1.6;">未設定</div>
            <div class="palette-section">位置</div>
            <div id="palette-pos" style="font-size:10px;color:var(--text-muted);padding:2px 4px;line-height:1.8">X: —<br>Y: —</div>
            <div class="palette-section">未配置</div>
            <div id="unplaced-station-list"></div>
            <div class="palette-section">追加</div>
            <div class="unplaced-add-row" style="flex-direction:column;gap:4px;">
                <input id="add-station-name" type="text" placeholder="表示名（省略可）"
                       style="width:100%;box-sizing:border-box;font-size:11px;padding:2px 5px;background:var(--bg-input,#1a2234);border:1px solid var(--border-color,#2a3a5c);border-radius:3px;color:var(--text-primary,#c8d4e8);">
                <div style="display:flex;gap:4px;">
                    <select id="add-station-type" style="flex:1;">
                        <option value="processing">Processing</option>
                        <option value="merge">Merge</option>
                        <option value="split">Split</option>
                        <option value="entry">Entry</option>
                        <option value="exit">Exit</option>
                    </select>
                    <button id="btn-add-station">+</button>
                </div>
            </div>
        </div>
        <div class="logic-canvas-area">
            <canvas id="logic-projection-canvas"></canvas>
            <svg id="logic-svg" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="arrowhead" markerWidth="8" markerHeight="6"
                            refX="7" refY="3" orient="auto">
                        <polygon points="0 0, 8 3, 0 6" fill="#4a9eff"/>
                    </marker>
                </defs>
                <g id="logic-grid-layer"></g>
                <g id="logic-conn-layer"></g>
                <g id="logic-origin-layer"></g>
                <g id="logic-station-layer"></g>
                <rect id="logic-select-rect" fill="rgba(74,158,255,0.08)" stroke="#4a9eff"
                      stroke-width="1" stroke-dasharray="4,3"
                      vector-effect="non-scaling-stroke" display="none"/>
            </svg>
            <div id="logic-info-bar">選択ツールでステーションをドラッグ、接続ツールで接続作成</div>
        </div>
        <div class="logic-props" id="logic-props">
            <div class="props-title">プロパティ</div>
            <div class="props-empty" id="props-empty">ステーションを選択</div>
            <div id="props-fields" style="display:none;"></div>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="btn-secondary" id="btn-cancel">キャンセル</button>
        <button class="btn-primary" id="btn-save" style="width:auto;padding:6px 20px;">保存する</button>
    </div>
</div>

<!-- Modal: 格子設定 -->
<div class="lw-modal-overlay" id="grid-size-modal" style="display:none">
    <div class="lw-modal">
        <div class="lw-modal-header">
            <span class="lw-modal-title">格子設定</span>
            <button class="lw-modal-close" data-close="grid-size-modal">✕</button>
        </div>
        <div class="lw-modal-body">
            <label>列数 (cols) <input type="number" id="gs-cols" min="1" max="50" value="20"></label>
            <label>行数 (rows) <input type="number" id="gs-rows" min="1" max="50" value="20"></label>
            <label>セルサイズ (m) <input type="number" id="gs-size" min="0.1" max="10" step="0.1" value="0.5"></label>
        </div>
        <div class="lw-modal-footer">
            <button class="btn-secondary" data-close="grid-size-modal">キャンセル</button>
            <button class="btn-primary" id="gs-ok">OK</button>
        </div>
    </div>
</div>

<!-- Modal: 高さ設定 -->
<div class="lw-modal-overlay" id="height-modal" style="display:none">
    <div class="lw-modal">
        <div class="lw-modal-header">
            <span class="lw-modal-title">高さ設定</span>
            <button class="lw-modal-close" data-close="height-modal">✕</button>
        </div>
        <div class="lw-modal-body">
            <label>高さ (m) <input type="number" id="h-val" min="0.1" max="20" step="0.1" value="1.5"></label>
        </div>
        <div class="lw-modal-footer">
            <button class="btn-secondary" data-close="height-modal">キャンセル</button>
            <button class="btn-primary" id="h-ok">OK</button>
        </div>
    </div>
</div>

<script type="module" src="js/local-window.js"></script>
</body>
</html>
