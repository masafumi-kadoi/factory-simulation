<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sim-executor - Scenario Detail</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>sim-executor</h1>
        <nav class="header-nav">
            <a href="index.html">Dashboard</a>
            <a href="http://localhost:8082" target="_blank">Scenario Editor</a>
            <a href="http://localhost:8081" target="_blank">sim-visualizer</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="breadcrumb">
            <a href="index.html">Dashboard</a>
            <span class="separator">/</span>
            <span id="breadcrumb-name">Scenario</span>
        </div>

        <div id="scenario-info" class="info-panel">
            <div class="loading">Loading scenario...</div>
        </div>

        <div class="section-header">
            <h2 class="section-title">Execution History</h2>
            <button id="btn-new-execution" class="btn btn-primary btn-sm" disabled>New Execution</button>
        </div>

        <div class="sort-bar">
            <span class="sort-label">並び替え:</span>
            <button class="exec-sort-btn active" data-sort="newest">新しい順</button>
            <button class="exec-sort-btn" data-sort="oldest">古い順</button>
            <button class="exec-sort-btn" data-sort="status">ステータス順</button>
        </div>

        <div id="executions-container">
            <div class="loading">Loading executions...</div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/scenario.js"></script>
</body>
</html>
