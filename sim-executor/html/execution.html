<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sim-executor - Execution Settings</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>sim-executor</h1>
        <nav class="header-nav">
            <a href="index.html">Dashboard</a>
            <a href="/editor" target="_blank">sim-editor</a>
            <a href="/visualizer" target="_blank">sim-visualizer</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="breadcrumb">
            <a href="index.html">Dashboard</a>
            <span class="separator">/</span>
            <a id="breadcrumb-scenario" href="#">Scenario</a>
            <span class="separator">/</span>
            <span>Execution Settings</span>
        </div>

        <div id="scenario-summary" class="info-panel">
            <div class="loading">Loading scenario...</div>
        </div>

        <!-- Simulation Time Settings -->
        <div class="info-panel">
            <div class="separator-label">Simulation Time</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="start-date">Start Date</label>
                    <input type="date" id="start-date" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label" for="start-time">Start Time</label>
                    <input type="time" id="start-time" class="form-input" value="08:00">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">End Condition</label>
                <div class="radio-group">
                    <div class="radio-option selected" data-type="duration">
                        <input type="radio" name="end-type" value="duration" checked>
                        <div class="radio-content">
                            <div class="radio-label">Duration (minutes)</div>
                            <div class="radio-inputs">
                                <input type="number" id="duration-value" value="480" min="1" style="width: 120px">
                                <span>min</span>
                            </div>
                        </div>
                    </div>
                    <div class="radio-option" data-type="absolute">
                        <input type="radio" name="end-type" value="absolute">
                        <div class="radio-content">
                            <div class="radio-label">Absolute End Time</div>
                            <div class="radio-inputs">
                                <input type="date" id="end-date" class="form-input" disabled>
                                <input type="time" id="end-time" class="form-input" disabled>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dynamic Parameters (Initial Conditions) -->
        <div class="info-panel">
            <div class="separator-label">Dynamic Parameter (Initial Conditions)</div>

            <div style="margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button id="btn-fetch-conditions" class="btn btn-primary btn-sm">Fetch from SimDB</button>
                <button id="btn-manual-conditions" class="btn btn-secondary btn-sm">Set Manually</button>
                <button id="btn-clear-conditions" class="btn btn-outline btn-sm" style="display: none;">Clear</button>
            </div>

            <div id="conditions-container">
                <div class="empty-state" style="padding: 1.5rem">
                    <p class="empty-hint">Click "Fetch from SimDB" or "Set Manually" to configure initial conditions</p>
                </div>
            </div>

            <div id="warnings-container"></div>
        </div>

        <!-- Execute button -->
        <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem">
            <button id="btn-execute" class="btn btn-success" disabled>Execute Simulation</button>
            <a id="btn-back" href="#" class="btn btn-outline">Back</a>
        </div>

        <div id="execute-result" style="margin-top: 1rem"></div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/execution.js"></script>
</body>
</html>
