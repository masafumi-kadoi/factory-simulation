<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation List - Factory Simulation</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Factory Simulation - シミュレーション一覧</span>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2>実行済みシミュレーション</h2>
                <p class="text-muted">シミュレーションをクリックすると可視化画面が開きます</p>

                <div id="loading" class="loading">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p>シミュレーションを読み込み中...</p>
                </div>

                <div id="error" class="error" style="display: none;"></div>

                <table id="simulations-table" class="table table-striped table-hover" style="display: none;">
                    <thead>
                        <tr>
                            <th>シミュレーションID</th>
                            <th>シナリオID</th>
                            <th>ステータス</th>
                            <th>終了時刻</th>
                            <th>終了理由</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="simulations-tbody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- API client -->
    <script src="js/api.js"></script>

    <script>
        // Load simulations on page load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const simulations = await fetchSimulations();

                const loading = document.getElementById('loading');
                const table = document.getElementById('simulations-table');
                const tbody = document.getElementById('simulations-tbody');

                loading.style.display = 'none';

                if (simulations.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">シミュレーションが見つかりませんでした</td></tr>';
                } else {
                    tbody.innerHTML = simulations.map(sim => `
                        <tr>
                            <td><code>${sim.simulationId}</code></td>
                            <td><code>${sim.scenarioId}</code></td>
                            <td><span class="badge bg-${sim.status === 'completed' ? 'success' : 'warning'}">${sim.status}</span></td>
                            <td>${sim.endTime ? sim.endTime.toFixed(2) : '-'}</td>
                            <td>${sim.endReason || '-'}</td>
                            <td>
                                <a href="visualize.html?sim=${sim.simulationId}" class="btn btn-sm btn-primary">可視化</a>
                            </td>
                        </tr>
                    `).join('');
                }

                table.style.display = 'table';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.textContent = 'シミュレーション一覧の読み込みに失敗しました: ' + error.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
